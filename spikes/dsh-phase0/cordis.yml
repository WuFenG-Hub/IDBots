# IDBots DSH Phase 0 spike: minimal self-composed runtime with a fake LLM.
#
# This mirrors the "subprocess runtime with our own composition" embedding
# mode: IDBots would ship exactly this kind of file (plus its own plugins)
# instead of forking anything upstream.

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.spike-sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fake-llm
  name: './plugins/fake-llm.mjs'

- id: idbots-wallet
  name: './plugins/idbots-wallet.mjs'
  config:
    initialBalances:
      alice: 100
      bob: 50

- id: idbots-tools
  name: './plugins/idbots-tools.mjs'
