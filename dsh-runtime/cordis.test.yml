# IDBots DSH runtime — M1 test composition.
#
# Development/test shape: core services + JSONL persistence + fake LLM fixture
# + our SDK server with the session/steer & session/cancel wire extensions.
# The production composition (provider routes from the app's provider table,
# idbots-permissions, idbots-prompt-sections, idbots-tools) is generated by the
# Electron main process in M3+; stdout belongs to the JSON-RPC protocol.

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.test-sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fake-llm
  name: './test/fixtures/fake-llm.mjs'

- id: idbots-test-tools
  name: './test/fixtures/test-tools.mjs'

- id: idbots-sdk-server
  name: './plugins/idbots-sdk-server.mjs'
