# pnpm 11 reads pnpm-specific settings only from this file. This package is
# intentionally its own workspace root (no `packages` key): the web-search
# skill keeps a separate lockfile from the repository root (the root
# postinstall installs it via
# `pnpm --dir SKILLs/web-search install --frozen-lockfile`).
#
# nodeLinker hoisted is REQUIRED: electron-builder ships SKILLs/ (including
# this node_modules) as extraResources; the default isolated linker would
# copy symlinks pointing into the developer's pnpm store and the packaged
# app would ship broken paths.
nodeLinker: hoisted

# Transitive security pin: proxy-addr ships in this tree via the express@4
# chain; 2.0.8 is the CVE-2026-90711 fix the image Trivy gate requires.
overrides:
  proxy-addr: 2.0.8
