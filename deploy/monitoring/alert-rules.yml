# WS-C REQ-C-16 — alert rules. One rule per requirement bullet.
# Control-plane metric names follow the convention documented in
# deploy/monitoring/README.md (WS-B REQ-B-20 does not fix names; adjust here
# if WS-B ships different ones).

groups:
  - name: idbots-host
    rules:
      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "host memory above 85% for 10m ({{ $value | printf \"%.0f\" }}%)"

      - alert: HostDiskHigh
        expr: (1 - node_filesystem_avail_bytes{mountpoint=~"/|/var/lib/docker", fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint=~"/|/var/lib/docker", fstype!~"tmpfs|overlay|squashfs"}) * 100 > 80
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "disk {{ $labels.mountpoint }} above 80% ({{ $value | printf \"%.0f\" }}%)"

      - alert: HostCPUHigh
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "host CPU above 85% for 10m ({{ $value | printf \"%.0f\" }}%) — Phase 0 saw tenants near 80% after onboarding"

  - name: idbots-tenants
    rules:
      - alert: TenantCPUSaturated
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name=~"idb-t_.*"}[5m])) > 1.9
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "tenant {{ $labels.name }} at its full 2 CPUs for 15m"

      - alert: TenantRestarting
        expr: changes(container_start_time_seconds{name=~"idb-t_.*"}[15m]) > 3
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "tenant {{ $labels.name }} restarted more than 3 times in 15m"

      - alert: TenantFailed
        expr: cp_tenants_by_status{status="failed"} > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "a tenant is in failed state (control plane)"

      - alert: TenantOOMKilled
        expr: increase(container_oom_events_total{name=~"idb-t_.*"}[15m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "OOM kill in tenant {{ $labels.name }} ({{ $value | printf \"%.0f\" }} in 15m)"

      - alert: TenantsNearCapacity
        expr: sum(cp_tenants_by_status) / max(cp_host_capacity) > 0.8
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "tenants at 80% of host capacity (REQ-C-19)"

  - name: idbots-control-plane
    rules:
      - alert: ControlPlaneDown
        expr: up{job="control-plane"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "control-plane /metrics scrape failing for 2m"

      - alert: ControlPlaneHealthFailing
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "https://{{ $labels.instance }} health probe failing for 2m (public path)"

      - alert: ControlPlane5xxHigh
        expr: sum(rate(cp_http_requests_total{status=~"5.."}[5m])) / sum(rate(cp_http_requests_total[5m])) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "control-plane 5xx above 2% for 5m ({{ $value | printf \"%.1%%\" }})"

  - name: idbots-tls
    rules:
      - alert: TLSCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 14 * 24 * 3600
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires within 14 days"

  - name: idbots-backup
    rules:
      - alert: BackupFailed
        expr: idbots_backup_last_result == 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "backup failed ({{ $labels.kind }}{{ $labels.tenant }})"

      - alert: BackupStale
        expr: time() - idbots_backup_last_success_timestamp_seconds > 26 * 3600
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "no successful backup in 26h ({{ $labels.kind }}{{ $labels.tenant }})"
