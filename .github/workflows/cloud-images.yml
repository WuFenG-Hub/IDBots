# WS-C REQ-C-9 — build, scan, conformance-test, and push the cloud images.
#
# Triggers: tags `cloud-v*` and manual dispatch. Produces
#   {REGISTRY}/idbots/tenant:{version}-{commit7}
#   {REGISTRY}/idbots/control-plane:{cpVersion}-{commit7}
# for linux/amd64, Trivy-scanned (fail on CRITICAL with a fix), with the
# conformance kit run against the started tenant image.
#
# Registry coordinates come from CI config, never from the repo (REQ-C-21):
#   vars.ACR_REGISTRY       e.g. registry.cn-hongkong.aliyuncs.com
#   secrets.ACR_USERNAME    ACR push RAM user (least privilege, push only)
#   secrets.ACR_PASSWORD
#
# Mock-first guards: until WS-B lands cloud/control-plane/Dockerfile and WS-A
# lands cloud/conformance/run.mjs, those legs skip with a loud ::warning and
# the tenant smoke test stands in for the kit. Remove the guards once both
# exist (tracked in the WS-C delivery note).

name: Cloud Images

on:
  push:
    tags:
      - 'cloud-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.ACR_REGISTRY || 'registry.cn-hongkong.aliyuncs.com' }}

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fail fast with NAMES ONLY (never values) when CI is missing its
      # registry config — an unauthenticated run must not produce or push
      # anything (WS-C review S2-4).
      - name: Verify registry credentials are injected
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          missing=""
          [ -n "$ACR_REGISTRY" ] || missing="$missing vars.ACR_REGISTRY"
          [ -n "$ACR_USERNAME" ] || missing="$missing secrets.ACR_USERNAME"
          [ -n "$ACR_PASSWORD" ] || missing="$missing secrets.ACR_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing CI configuration (names only):$missing"
            exit 1
          fi
          echo "registry credentials present (values not shown)"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image coordinates
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          COMMIT7="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit7=$COMMIT7" >> "$GITHUB_OUTPUT"
          echo "tenant_tag=${REGISTRY}/idbots/tenant:${VERSION}-${COMMIT7}" >> "$GITHUB_OUTPUT"
          if [ -f cloud/control-plane/package.json ]; then
            CP_VERSION="$(node -p "require('./cloud/control-plane/package.json').version")"
          else
            CP_VERSION="$VERSION"
          fi
          echo "cp_tag=${REGISTRY}/idbots/control-plane:${CP_VERSION}-${COMMIT7}" >> "$GITHUB_OUTPUT"

      - name: Build tenant image (linux/amd64)
        run: |
          REGISTRY="${REGISTRY}" IDBOTS_BUILDER=buildx \
            deploy/tenant-image/build.sh --platform linux/amd64 \
            --tag "${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.commit7 }}"

      # The control-plane Dockerfile copies dist-mobile-login/ from the repo root,
      # so the bundle must exist before its build starts (the Dockerfile documents
      # this contract in its header).
      - name: Build mobile login bundle for the control-plane image
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:mobile

      - name: Build control-plane image (linux/amd64)
        id: cp-build
        if: hashFiles('cloud/control-plane/Dockerfile') != ''
        run: |
          # BUILD CONTEXT IS THE REPOSITORY ROOT (see cloud/control-plane/Dockerfile
          # header): the Dockerfile copies both cloud/control-plane/** and the
          # root-level dist-mobile-login/. Passing cloud/control-plane as the
          # context made every COPY resolve against the wrong root and the build
          # failed with "failed to calculate checksum ... not found".
          docker buildx build \
            --platform linux/amd64 \
            --tag "${{ steps.meta.outputs.cp_tag }}" \
            --file cloud/control-plane/Dockerfile \
            --load \
            .

      - name: Control-plane Dockerfile missing (WS-B pending)
        if: hashFiles('cloud/control-plane/Dockerfile') == ''
        run: |
          echo "::warning::cloud/control-plane/Dockerfile not present — WS-B has not delivered it at this baseline. Skipping control-plane build/scan/push; the gate enforces itself once the file lands."

      - name: Trivy scan — tenant (fail on fixed CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tenant_tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy scan — control-plane (fail on fixed CRITICAL)
        if: hashFiles('cloud/control-plane/Dockerfile') != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.cp_tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Start the tenant image
        run: |
          docker run -d --init --name idb-t_ci \
            --memory 2304m --cpus 2 --pids-limit 2048 --shm-size 1g \
            --cap-drop ALL --security-opt no-new-privileges \
            -e IDBOTS_SERVER_MODE=1 \
            -e IDBOTS_TENANT_ID=t_ci0000000000000000 \
            -e IDBOTS_GATEWAY_SECRET=ci-test-secret \
            -e IDBOTS_GATEWAY_TEST_HOOKS=1 \
            -p 127.0.0.1:8790:8790 \
            "${{ steps.meta.outputs.tenant_tag }}"
          # /healthz answers 200 as soon as the socket is up, while the gateway is
          # still "bootstrapping" (ready=false). Every N-tier check then fails with
          # TENANT_NOT_READY, so gate on /readyz — C1's readiness probe, which only
          # returns 200 for phase ready/degraded.
          # Cold-start of skill services was measured at ~109s on a 2-CPU runner,
          # so 120s was cutting it too fine; allow 300s and log progress.
          for i in $(seq 1 300); do
            if curl -fsS -m 2 http://127.0.0.1:8790/readyz >/dev/null 2>&1; then
              echo "tenant ready after ${i}s"
              curl -fsS -m 2 http://127.0.0.1:8790/readyz || true
              exit 0
            fi
            if [ $((i % 20)) -eq 0 ]; then echo "still bootstrapping after ${i}s"; fi
            sleep 1
          done
          echo "tenant never reached ready; last readyz:"
          curl -sS -m 2 http://127.0.0.1:8790/readyz || true
          docker logs idb-t_ci
          exit 1

      - name: Conformance kit (WS-A) against the running tenant
        if: hashFiles('cloud/conformance/run.mjs') != ''
        run: |
          pnpm install --frozen-lockfile
          # The kit takes --url as a ws:// endpoint (see cloud/conformance/run.mjs
          # header). The previous --target flag is not a recognised argument, so the
          # step exited 2 before running a single check.
          node cloud/conformance/run.mjs \
            --url ws://127.0.0.1:8790/gateway/v1/ws --secret ci-test-secret

      - name: Stand-in smoke test (until the WS-A conformance kit lands)
        if: hashFiles('cloud/conformance/run.mjs') == ''
        run: |
          echo "::warning::cloud/conformance/run.mjs not present — running deploy/tenant-image/smoke-test.mjs instead. The WS-A conformance kit supersedes this step (REQ-C-9 step 3)."
          node deploy/tenant-image/smoke-test.mjs http://127.0.0.1:8790 ci-test-secret

      - name: Log in to ACR (push credential from CI secrets)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push tenant image
        run: docker push "${{ steps.meta.outputs.tenant_tag }}"

      - name: Push control-plane image
        if: hashFiles('cloud/control-plane/Dockerfile') != ''
        run: docker push "${{ steps.meta.outputs.cp_tag }}"

      - name: Verify pushed manifests and C1 labels
        run: |
          docker buildx imagetools inspect "${{ steps.meta.outputs.tenant_tag }}"
          docker buildx imagetools inspect "${{ steps.meta.outputs.tenant_tag }}" \
            --format '{{ json .Image.Config.Labels }}' | grep org.idbots.contract
